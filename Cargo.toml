[workspace]
members = [
    "device",
    "device_server",
    "web_server",
]
exclude = ["device_firmvare"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
tonic = "0.14"
tracing = "0.1"

[workspace.dependencies.clap]
version = "4.6"
features = [
    "derive",
    "env",
]

[workspace.dependencies.serde]
version = "1.0"
features = ["derive"]

[workspace.dependencies.tokio]
version = "1.53"
features = ["full"]

[workspace.dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
